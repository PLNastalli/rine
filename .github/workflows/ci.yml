name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # Performance: publica + avisa, sem hard-fail em runners
      # compartilhados (variação alta). Self-hosted dedicado no futuro
      # pode trocar para --strict (ver bench/README.md).
      - name: perf-check
        run: cargo run -q -p perf --bin rine-bench -- check

name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: apply find-file implementation
        if: startsWith(github.event.head_commit.message, '[apply-find-file]')
        run: |
          python3 .github/apply_find_file.py
          cargo fmt
          git config user.name "Rine CI"
          git config user.email "rine-ci@users.noreply.github.com"
          git add crates/winabi crates/nt-object crates/nt-file crates/ntdll crates/kernelbase crates/kernel32
          git commit -m "feat: implement Win32 directory enumeration"
          git push
      - name: focused find-file regressions
        run: |
          cargo test -p winabi --test find_data_abi
          cargo test -p nt-file --test find_file
          cargo test -p kernel32 --test find_file_exports
      - name: linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: manager sidecar
        run: crates/manager-tauri/pack-sidecar.sh --debug
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # Performance: publica + avisa, sem hard-fail em runners
      # compartilhados (variação alta). Self-hosted dedicado no futuro
      # pode trocar para --strict (ver bench/README.md).
      - name: perf-check
        run: cargo run -q -p perf --bin rine-bench -- check
